stages:
  - backup
  - deploy

variables:
  projectName: Prepara.Me - API
  projectType: prepara_api
  projetctFolder: preparame/api
  shouldRunCompose: "false"
  projectPm2Name: app-preparame-api
  projectPm2NameProd: preparame-api
  projetctFolderProd: preparame/api
  PROD_APP_DIR: "/var/www/preparame/api"
  BACKUP_ROOT: "/var/backups/preparame"

backup_prod_db:
  stage: backup
  script:
    - |
      set -e
      echo "Backup Postgres producao - Prepara.me"
      echo "PROD_APP_DIR=${PROD_APP_DIR}"
      echo "BACKUP_ROOT=${BACKUP_ROOT}"
      if [ ! -d "${PROD_APP_DIR}" ]; then
        echo "Pasta da API nao encontrada: ${PROD_APP_DIR}"
        exit 1
      fi
      sed -i 's/\r$//' ./scripts/backup_prod_db.sh
      chmod +x ./scripts/backup_prod_db.sh
      ./scripts/backup_prod_db.sh
      echo "Listando backups recentes"
      ls -lht "${BACKUP_ROOT}" 2>/dev/null | head -20 || ls -lht /var/www/preparame/backups 2>/dev/null | head -20 || ls -lht "${HOME}/preparame-backups" 2>/dev/null | head -20 || true
  tags:
    - preparame_prod
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^chore\/ci-backup/'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual
  allow_failure: false

# Copia o dump mais recente do servidor para artifact do GitLab (download na UI).
# ATENCAO: contem dados de producao — baixe, guarde offline e nao compartilhe o link.
download_latest_prod_backup:
  stage: backup
  script:
    - |
      set -e
      mkdir -p downloaded-backup
      LATEST=$(ls -1t /var/backups/preparame/preparame_prod_*.sql 2>/dev/null | head -1 || true)
      if [ -z "$LATEST" ]; then
        LATEST=$(ls -1t /var/www/preparame/backups/preparame_prod_*.sql 2>/dev/null | head -1 || true)
      fi
      if [ -z "$LATEST" ]; then
        echo "Nenhum backup encontrado em /var/backups/preparame"
        exit 1
      fi
      echo "Copiando $LATEST"
      cp -v "$LATEST" downloaded-backup/
      cp -v "${LATEST}.sha256" downloaded-backup/ 2>/dev/null || true
      cp -v "${LATEST}.meta" downloaded-backup/ 2>/dev/null || true
      ls -lh downloaded-backup/
  artifacts:
    name: "preparame-prod-backup"
    paths:
      - downloaded-backup/
    expire_in: 3 days
    when: on_success
  tags:
    - preparame_prod
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual
    - if: '$CI_COMMIT_BRANCH =~ /^chore\/ci-backup/'
      when: manual
  allow_failure: false

deploy_job:
  stage: deploy
  script:
    - echo "Deploying develop branch..."
    - cd /var/www/app/$projetctFolder
    - git checkout .
    - git pull origin develop
    - echo "Publicando $projectName"
    - sed -i 's/\r$//' /var/www/app/$projetctFolder/scripts/deploy.sh
    - chmod +x ./scripts/deploy.sh
    - ./scripts/deploy.sh $projetctFolder $projectPm2Name
    - echo "Finalizando deploy..."
  tags:
    - nodedso_homolog
  only:
    - develop

deploy_production:
  stage: deploy
  needs:
    - job: backup_prod_db
  script:
    - echo "Deploying master branch..."
    - cd /var/www/$projetctFolderProd
    - git checkout .
    - git pull origin master
    - echo "Publicando $projectName"
    - sed -i 's/\r$//' /var/www/$projetctFolderProd/scripts/deploy_prod.sh
    - chmod +x ./scripts/deploy_prod.sh
    - ./scripts/deploy_prod.sh $projetctFolderProd $projectPm2NameProd
    - echo "Finalizando deploy..."
  tags:
    - preparame_prod
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual
  allow_failure: false
